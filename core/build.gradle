plugins {
	id 'java-library'
}

repositories {
	mavenCentral()
}

dependencies {
	// Minecraft ships Gson at runtime; core must not bundle its own.
	compileOnly "com.google.code.gson:gson:${gson_version}"

	testImplementation platform("org.junit:junit-bom:${junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testImplementation 'org.junit.jupiter:junit-jupiter-params'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation "org.assertj:assertj-core:${assertj_version}"
	testImplementation "net.jqwik:jqwik:${jqwik_version}"
	testImplementation "com.google.code.gson:gson:${gson_version}"
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
	options.encoding = 'UTF-8'
}

test {
	useJUnitPlatform {
		includeEngines 'junit-jupiter', 'jqwik'
	}
}
