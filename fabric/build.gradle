plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
}

base {
	archivesName = 'hearthside'
}

loom {
	splitEnvironmentSourceSets()

	mods {
		hearthside {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		// A second client that boots in satellite role, in its own run directory.
		// Drives the walking-skeleton end-to-end check (see E2eDriver).
		e2eClient {
			client()
			name = 'E2E Client'
			vmArg '-Dhearthside.e2e=true'
			runDir 'run-e2e'
		}

		satelliteClient {
			client()
			name = 'Satellite Client'
			vmArg '-Dhearthside.role=satellite'
			runDir 'run-satellite'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

	implementation project(':core')
	include project(':core')

	// Compatibility targets, present only in dev runs.
	runtimeOnly "maven.modrinth:sodium:${sodium_version}"
	runtimeOnly "maven.modrinth:iris:${iris_version}"
}

processResources {
	def version = project.version
	inputs.property 'version', version

	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
	options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
